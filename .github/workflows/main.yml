name: Tailscale Windows RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP Admin Password'
        required: true
        default: 'P@ssw0rd2026!'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. RDP 서비스 활성화 및 관리자 비밀번호 변경
      - name: Enable RDP & Set Password
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = convertto-securestring "${{ github.event.inputs.rdp_password }}" -asplaintext -force
          Set-LocalUser -Name "runneradmin" -Password $Password

      # 2. Tailscale 설치 및 가상 머신 노드 연결
      - name: Connect to Tailscale
        shell: powershell
        run: |
          echo "Installing Tailscale..."
          choco install tailscale -y
          
          echo "Starting Tailscale Service..."
          Start-Service Tailscale
          
          echo "Connecting to Tailscale Network..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

      # 3. 접속 정보 및 Tailscale IP 출력
      - name: Display Connection Details
        shell: powershell
        run: |
          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host " Tailscale IP : $tsIp" -ForegroundColor Yellow
          Write-Host " RDP Username : runneradmin" -ForegroundColor Yellow
          Write-Host " RDP Password : ${{ github.event.inputs.rdp_password }}" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Green

      # 4. 세션 유지 (최대 6시간 유지)
      - name: Keep Alive Session
        shell: powershell
        run: |
          $timeout = 21600 # 6시간 (초 단위)
          $interval = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              Write-Host "RDP Active... Elapsed: $($elapsed / 60) mins"
          }
