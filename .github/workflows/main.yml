name: Localtunnel Windows RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP Admin Password'
        required: true
        default: 'P@ssw0rd2026!'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. RDP 활성화 및 비밀번호 설정
      - name: Enable RDP & Set Password
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = convertto-securestring "${{ github.event.inputs.rdp_password }}" -asplaintext -force
          Set-LocalUser -Name "runneradmin" -Password $Password

      # 2. Node.js 패키지로 localtunnel 설치 및 RDP 터널 실행
      - name: Install and Start Localtunnel
        shell: powershell
        run: |
          npm install -g localtunnel
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c lt --port 3389 > lt.log 2>&1"
          Start-Sleep -Seconds 7

      # 3. 접속 주소 추출
      - name: Get RDP Address
        shell: powershell
        run: |
          Get-Content lt.log | Write-Host
          $ltUrl = (Get-Content lt.log | Select-String "your url is:").ToString().Replace("your url is: https://", "").Trim()
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host " RDP Address  : $ltUrl:3389" -ForegroundColor Yellow
          Write-Host " RDP Username : runneradmin" -ForegroundColor Yellow
          Write-Host " RDP Password : ${{ github.event.inputs.rdp_password }}" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Green

      # 4. 세션 유지 (6시간)
      - name: Keep Alive Session
        shell: powershell
        run: |
          $timeout = 21600
          $interval = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              Write-Host "RDP Active... Elapsed: $($elapsed / 60) mins"
          }
