name: Cloudflare Windows RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP Admin Password'
        required: true
        default: 'P@ssw0rd2026!'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. RDP 활성화 및 비밀번호 설정
      - name: Enable RDP & Set Password
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = convertto-securestring "${{ github.event.inputs.rdp_password }}" -asplaintext -force
          Set-LocalUser -Name "runneradmin" -Password $Password

      # 2. cloudflared 다운로드 및 설치
      - name: Install Cloudflare Tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      # 3. Cloudflare 임시 TCP 터널 실행
      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "cloudflared.log"
          Start-Sleep -Seconds 10

      # 4. 접속 주소 추출
      - name: Get RDP Address
        shell: powershell
        run: |
          $logContent = Get-Content cloudflared.log -Raw
          Write-Host "--- Cloudflare Raw Log ---"
          Write-Host $logContent

          if ($logContent -match "https://([a-zA-Z0-9-]+\.trycloudflare\.com)") {
              $tunnelUrl = $matches[1]
              Write-Host "==============================================" -ForegroundColor Green
              Write-Host " Cloudflare Host : $tunnelUrl" -ForegroundColor Yellow
              Write-Host " RDP Username    : runneradmin" -ForegroundColor Yellow
              Write-Host " RDP Password    : ${{ github.event.inputs.rdp_password }}" -ForegroundColor Yellow
              Write-Host "==============================================" -ForegroundColor Green
          } else {
              Write-Host "주소 자동 추출 실패. Raw Log에서 .trycloudflare.com 주소를 확인하세요." -ForegroundColor Red
          }

      # 5. 세션 유지 (6시간)
      - name: Keep Alive Session
        shell: powershell
        run: |
          $timeout = 21600
          $interval = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              Write-Host "RDP Active... Elapsed: $($elapsed / 60) mins"
          }
