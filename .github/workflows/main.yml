name: Serveo Windows RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP Admin Password'
        required: true
        default: 'P@ssw0rd2026!'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. RDP 활성화 및 비밀번호 설정
      - name: Enable RDP & Set Password
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = convertto-securestring "${{ github.event.inputs.rdp_password }}" -asplaintext -force
          Set-LocalUser -Name "runneradmin" -Password $Password

      # 2. Serveo SSH RAW TCP 터널 실행
      - name: Start Serveo TCP Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 serveo.net > serveo.log 2>&1"
          Start-Sleep -Seconds 10

      # 3. 접속 주소 및 포트 추출
      - name: Get RDP Address
        shell: powershell
        run: |
          $logContent = Get-Content serveo.log -Raw
          Write-Host "--- Serveo Raw Log ---"
          Write-Host $logContent

          if ($logContent -match "Forwarding HTTP traffic from|Forwarding TCP traffic from|from tcp://([^\s:]+:[\d]+)") {
              $line = (Select-String -Path serveo.log -Pattern "serveo.net:").Line
              Write-Host "==============================================" -ForegroundColor Green
              Write-Host " Raw Output : $line" -ForegroundColor Yellow
              Write-Host " RDP Username : runneradmin" -ForegroundColor Yellow
              Write-Host " RDP Password : ${{ github.event.inputs.rdp_password }}" -ForegroundColor Yellow
              Write-Host "==============================================" -ForegroundColor Green
          } else {
              Write-Host "로그 전문을 확인하세요."
          }

      # 4. 세션 유지 (6시간)
      - name: Keep Alive Session
        shell: powershell
        run: |
          $timeout = 21600
          $interval = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              Write-Host "RDP Active... Elapsed: $($elapsed / 60) mins"
          }
